localization_node:
  ros__parameters:
    # RPP owns the complete filter graph. The script's filter slot selects
    # Ekf15 or Ukf15, and the selected filter component owns its model slot.
    script: rpp_localization::localization
    configuration: ekf

    frequency: 30.0
    sensor_timeout: 0.1
    world_frame: odom
    odom_frame: odom
    base_link_frame: base_link

    initial_estimate_covariance:
      [1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9,
       1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9,
       1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9, 1.0e-9]
